<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PawLove - Mascotas</title>
    <meta name="description" content="Nutrición casera y hábitos diarios para perros y gatos, recetario balanceado, cálculo metabólico RER/MER, monitor de hidratación y agenda médica con avisos." />
    <meta property="og:title" content="PawLove - Mascotas" />
    <meta property="og:description" content="Nutrición casera y hábitos diarios para perros y gatos, recetario balanceado, cálculo metabólico RER/MER, monitor de hidratación y agenda médica con avisos." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FAF7F2" id="meta-theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" id="meta-apple-status-bar" />
    <meta name="apple-mobile-web-app-title" content="PawLove" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      (function() {
        // Theme initialization (defaults to light mode unless explicitly saved as dark)
        try {
          var t = null;
          try {
            t = localStorage.getItem('pawlove_theme');
          } catch (storageErr) {}

          var isDark = (t === 'dark');
          var root = document.documentElement;
          var meta = document.getElementById('meta-theme-color');
          var appleMeta = document.getElementById('meta-apple-status-bar');

          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.colorScheme = 'dark';
            root.setAttribute('data-theme', 'dark');
            if (meta) meta.setAttribute('content', '#0A0F0D');
            if (appleMeta) appleMeta.setAttribute('content', 'black-translucent');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.style.colorScheme = 'light';
            root.setAttribute('data-theme', 'light');
            if (meta) meta.setAttribute('content', '#FAF7F2');
            if (appleMeta) appleMeta.setAttribute('content', 'default');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased selection:bg-emerald-500/20 selection:text-emerald-400">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
